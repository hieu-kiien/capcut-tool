[package]
name = "capcut_long_story_studio_tauri"
version = "0.0.1-experimental"
# Experimental R&D branch, not the release runtime. The shipping app is
# Python/PySide6 at 0.1.0-mvp (see mvp_runtime/__init__.py). Exit criteria
# for this branch are listed in PROJECT.md.
description = "Experimental Rust/Tauri engine for CapCut Long Story Studio (not shipped)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
memmap2 = "0.9"
fs2 = "0.4"
lru = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
